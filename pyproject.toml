[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screener"
version = "0.1.0"
description = "Local-only personal stock/options screener with weighted composite ranking"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["screener*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never touch the network. The synthetic provider exists for this.
addopts = "-q --strict-markers"
markers = [
    "network: tests that require live market data (deselected by default)",
]
